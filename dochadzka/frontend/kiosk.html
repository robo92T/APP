<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b51"><title>BID · Dochádzkový terminál</title><style>
*{box-sizing:border-box}body{margin:0;background:#081d39;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100dvh}.layout{min-height:100dvh;display:grid;grid-template-columns:37% 63%}.clock{padding:7vw 4vw;background:linear-gradient(145deg,#102f5a,#071c35);display:flex;flex-direction:column;justify-content:space-between;border-right:4px solid #f8c800}.brand{font-weight:850;font-size:clamp(23px,3vw,40px)}.brand span{color:#f8ca0d}.time{font-size:clamp(70px,8vw,130px);font-weight:850;letter-spacing:-6px}.date{font-size:20px;color:#b9c9e6}.status{color:#b9d1ec}.screen{padding:6vw 5vw;display:flex;flex-direction:column;justify-content:center;text-align:center;align-items:center}.symbol{font-size:70px;color:#ffcc0e}.headline{font-size:clamp(30px,5vw,65px);font-weight:850;margin:22px 0}.subtitle{color:#b9c9e6;font-size:clamp(15px,2vw,24px);max-width:640px}input{display:block;width:min(410px,90%);padding:16px;border:2px solid #41668e;border-radius:13px;font-size:19px;background:#153960;color:#fff;margin:35px auto 10px;text-align:center}button{background:#ffcb07;color:#122747;font-weight:800;border:0;border-radius:12px;padding:15px 20px;font-size:18px;cursor:pointer}.small{font-size:12px;color:#b9c9e6}.setup{margin-top:22px}.setup button{background:#193b65;color:#dce9ff;border:1px solid #587399;font-size:13px;padding:11px 15px}.flash{padding:16px;border-radius:14px;min-height:60px;margin-top:25px;font-size:21px;font-weight:700}.ok{background:#165f50}.bad{background:#742c40}@media(max-width:750px){.layout{grid-template-columns:1fr}.clock{min-height:190px;padding:22px;gap:12px}.time{font-size:55px;letter-spacing:-2px}.screen{padding:27px 18px}.headline{margin:12px 0}.symbol{font-size:48px}}</style></head>
<body><div class="layout"><aside class="clock"><div class="brand"><span>BID</span> · Dochádzka</div><div><div class="time" id="clock">--:--</div><div class="date" id="date"></div></div><div class="status">● Terminál · vyžaduje pripojenie k serveru</div></aside>
<main class="screen"><div class="symbol">◈</div><h1 class="headline">Priložte čip</h1><p class="subtitle">Zaznamenanie príchodu alebo odchodu. Čítačka musí odoslať UID čipu a stlačenie Enter.</p><input id="uid" autofocus autocomplete="off" aria-label="UID dochádzkového čipu" placeholder="Načítaj RFID čip" maxlength="128"><div id="feedback" aria-live="polite"></div><div class="setup"><button id="configure">⚙ Nastaviť kľúč terminálu</button></div><p class="small">Testovací terminál – bez offline fronty. Bez vlastného kľúča priradeného zariadeniu nenasadzovať do prevádzky.</p></main></div>
<script>
const input=document.querySelector('#uid'),feedback=document.querySelector('#feedback');
let key=sessionStorage.getItem('kiosk_key')||'',locked=false;
function clock(){const d=new Date();document.querySelector('#clock').textContent=d.toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'});document.querySelector('#date').textContent=d.toLocaleDateString('sk-SK',{dateStyle:'full'})};clock();setInterval(clock,1000);
document.querySelector('#configure').onclick=()=>{const v=prompt('Vlož samostatný kľúč terminálu. Uchovávaj ho len na dôveryhodnom zariadení.');if(v){key=v.trim();sessionStorage.setItem('kiosk_key',key)}input.focus()};
function message(msg,good){feedback.className='flash '+(good?'ok':'bad');feedback.textContent=msg;setTimeout(()=>{feedback.textContent='';feedback.className=''},6000)}
input.addEventListener('keydown',async ev=>{if(ev.key!=='Enter'||locked)return;ev.preventDefault();const uid=input.value.trim();input.value='';if(!uid)return;if(!key)return message('Najprv nastav kľúč terminálu.',false);
locked=true;try{const res=await fetch('/api/terminal/punch',{method:'POST',headers:{'Content-Type':'application/json','X-Terminal-Key':key},body:JSON.stringify({card_uid:uid,device_id:'web-kiosk',kind:'toggle'})});const value=await res.json();if(!res.ok)throw Error(typeof value.detail==='string'?value.detail:'Nepodarilo sa overiť čip');message(value.employee+' · '+(value.kind==='in'?'Príchod':'Odchod')+' · '+new Date(value.time).toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'}),true)}catch(err){message(err.message||'Chyba spojenia',false)}finally{locked=false;input.focus()}});
document.body.addEventListener('click',()=>{if(document.activeElement!==input)input.focus()});
</script></body></html>
