# Reverzná proxy s TLS. Na internet publikovať len cez WAF/reverznú proxy organizácie.
server {
    listen 80;
    server_name dochadzka.bid.sk;
    return 301 https://$host$request_uri;
}
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
server {
    listen 443 ssl;
    http2 on;
    server_name dochadzka.bid.sk;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 2m;
    server_tokens off;

    # terminálové API len z internej siete (upraviť rozsah)
    location /api/kiosk/ {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    # dokumentácia API len z internej siete
    location /api/docs { allow 10.0.0.0/8; deny all; proxy_pass http://app:8000; }
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
