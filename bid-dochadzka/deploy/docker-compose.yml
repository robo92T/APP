# Spustenie:  cd deploy && docker compose up -d --build
services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    volumes: [ "dochadzka-data:/app/data" ]
    networks: [ internal ]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [ app ]
    ports: [ "443:443", "80:80" ]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro        # certifikát (fullchain.pem, privkey.pem) od správcu IT
    networks: [ internal ]
  backup:
    image: alpine:3.20
    restart: unless-stopped
    volumes: [ "dochadzka-data:/data:ro", "./backups:/backups" ]
    # denná záloha o 02:30, uchováva 35 dní
    command: sh -c "apk add --no-cache sqlite >/dev/null && while true; do sleep $$(( (86400 + 9000 - $$(date +%s) % 86400) % 86400 )); sqlite3 /data/dochadzka.db \".backup /backups/dochadzka_$$(date +%F).db\"; find /backups -name '*.db' -mtime +35 -delete; done"
volumes:
  dochadzka-data:
networks:
  internal:
